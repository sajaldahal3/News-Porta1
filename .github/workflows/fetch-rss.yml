name: Fetch RSS Feeds

on:
  schedule:
    # Every 5 minutes — GitHub Actions doesn't guarantee exact timing
    # (expect some jitter, especially under load), and anything more
    # frequent than 5 minutes isn't reliably honored anyway.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Prevents two runs from ever executing at the same time. If a run is
# still going when the next scheduled trigger fires, the new one waits
# in queue instead of starting in parallel — this is what actually makes
# a 5-minute schedule safe (the ingestion script's own create()-based
# dedupe already prevents duplicate articles, but this avoids wasted
# double-fetching of the same feeds).
concurrency:
  group: fetch-rss
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (reproducible, from lockfile)
        run: npm ci

      - name: Run RSS ingestion
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node fetch-rss.js
